services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/erp
      DB_USER: erp
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      PROVISIONING_KEY: ${PROVISIONING_KEY:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SERVER_PORT: 8080
      FISCAL_MASTER_KEY: ${FISCAL_MASTER_KEY:-}
      ERP_FINANCE_ZONE: ${ERP_FINANCE_ZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
