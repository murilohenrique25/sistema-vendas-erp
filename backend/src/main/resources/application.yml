spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:18080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
erp:
  fiscal:
    master-key: ${FISCAL_MASTER_KEY:}
  provisioning-key: ${PROVISIONING_KEY:}
springdoc:
  api-docs.enabled: ${API_DOCS_ENABLED:false}
  swagger-ui.enabled: ${API_DOCS_ENABLED:false}
